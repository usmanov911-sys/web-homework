<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <!-- Bootstrap через CDN (удалённый репозиторий) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Мой сайт</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="/contacts">Контакты</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

<main class="container my-5">
    <!-- Hero-секция -->
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Добро пожаловать!</h1>
        <p class="lead">Это простая веб-страница, собранная на Bootstrap.</p>
        <a href="/contacts" class="btn btn-primary btn-lg">Связаться с нами</a>
    </div>

    <!-- Карточки -->
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <img src="https://picsum.photos/400/200?1" class="card-img-top" alt="Карточка 1">
                <div class="card-body">
                    <h5 class="card-title">Заголовок 1</h5>
                    <p class="card-text">Краткое описание первого блока.</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <img src="https://picsum.photos/400/200?2" class="card-img-top" alt="Карточка 2">
                <div class="card-body">
                    <h5 class="card-title">Заголовок 2</h5>
                    <p class="card-text">Краткое описание второго блока.</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <img src="https://picsum.photos/400/200?3" class="card-img-top" alt="Карточка 3">
                <div class="card-body">
                    <h5 class="card-title">Заголовок 3</h5>
                    <p class="card-text">Краткое описание третьего блока.</p>
                </div>
            </div>
        </div>
    </div>
</main>
